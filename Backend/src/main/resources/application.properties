spring.application.name=backend

# Server Configuration
server.port=8080

# CORS Configuration - Vue.js frontend URLs (comma-separated)
# Common Vue development ports: 3000 (Vue CLI), 5173 (Vite), 8080 (alternative)
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:gamedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for viewing database in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
